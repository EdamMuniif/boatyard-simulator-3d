name: Validate Boatyard Simulator

on:
  pull_request:
    branches: [main]
  push:
    branches: ["feature/mvp-stabilization-v0.2"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run mission, collision, and recovery tests
        run: npm test
      - name: Run Chromium touch-control smoke test
        run: npm run test:browser
